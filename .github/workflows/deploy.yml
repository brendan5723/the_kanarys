name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_ses_from: ${{ vars.SES_FROM }}
  TF_VAR_ses_to: ${{ vars.SES_TO }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            lambda/contact/package-lock.json

      - name: Install web
        run: npm ci
        working-directory: web

      - name: Build web
        run: npm run build
        working-directory: web
        env:
          VITE_CONTACT_URL: /contact

      - name: Install lambda
        run: npm ci --omit=dev
        working-directory: lambda/contact

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform format check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve

      - name: Sync site and invalidate cache
        working-directory: infra
        run: |
          BUCKET=$(terraform output -raw site_bucket)
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          aws s3 sync ../web/dist "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          echo "Site: $(terraform output -raw cloudfront_url)"
